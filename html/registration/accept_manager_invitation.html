      <!-- THE PAGE -->

      <!-- THE FORM -->
      <form id="accept_invitation_form">
        <div class="name_fields">
          <label>Create your manager account:</label>

          <div class="registration_names">
            <label for="invitation_code">Invitation code</label>
            <input
              type="text"
              id="invitation_code"
              required
              minlength="64"
              maxlength="64"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
            />
          </div>

          <div class="registration_names">
            <label for="firstname">First name</label>
            <input
              type="text"
              id="firstname"
              required
              maxlength="50"
              autocomplete="given-name"
            />
          </div>

          <div class="registration_names">
            <label for="lastname">Last name</label>
            <input
              type="text"
              id="lastname"
              required
              maxlength="50"
              autocomplete="family-name"
            />
          </div>

          <div class="registration_names">
            <label for="manager_pin">Choose a four-digit PIN</label>
            <input
              type="password"
              id="manager_pin"
              required
              inputmode="numeric"
              pattern="[0-9]{4}"
              minlength="4"
              maxlength="4"
              autocomplete="new-password"
            />
          </div>

          <div class="registration_names">
            <label for="confirm_pin">Confirm PIN</label>
            <input
              type="password"
              id="confirm_pin"
              required
              inputmode="numeric"
              pattern="[0-9]{4}"
              minlength="4"
              maxlength="4"
              autocomplete="new-password"
            />
          </div>
        </div>

        <!-- Pin Match Confirm -->
        <div
          class="pin_match_confirm"
          id="pin_match_confirm"
          role="status"
          aria-live="polite"
        >
          <p class="match_">
            PINs match
            <img
              src="../../img/pins-match/match.png"
              class="pin_match"
              alt=""
            />
          </p>

          <p class="no_match">
            PINs don't match
            <img
              src="../../img/pins-match/no_match.png"
              class="pin_match"
              alt=""
            />
          </p>
        </div>

        <div class="name_notify">
          <p id="invitation_notify" role="status" aria-live="polite"></p>
        </div>

        <button type="submit" class="submit" id="accept_invitation" disabled>
          Create Manager Account
        </button>
